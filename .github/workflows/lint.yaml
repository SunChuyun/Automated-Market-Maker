name: Project checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install locked dependencies
        run: ./yarn install --immutable

      - name: Compile and test contracts
        run: |
          ./yarn compile
          ./yarn test

      - name: Start local chain and generate frontend contract information
        shell: bash
        run: |
          ./yarn chain > /tmp/amm-hardhat.log 2>&1 &
          for attempt in {1..30}; do
            if curl --silent --fail --header 'Content-Type: application/json' \
              --data '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}' \
              http://127.0.0.1:8545 | grep --quiet '"result":"0x7a69"'; then
              ./yarn deploy
              exit 0
            fi
            sleep 1
          done
          cat /tmp/amm-hardhat.log
          exit 1

      - name: Check code and frontend types
        run: |
          ./yarn lint
          ./yarn hardhat:check-types
          ./yarn next:check-types
